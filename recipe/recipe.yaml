schema_version: 1

context:
  python_min: "3.11"
  version: "1.0.11"

package:
  name: footbridge
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/footbridge/footbridge-${{ version }}.tar.gz
  sha256: 193690a7548dabc20121a94c8e0a86b4bcf20854c86cc2d551181502efabca33

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - gdal >=3.8
    - geopandas >=1.1
    - matplotlib-base >=3.9
    - xmltodict >=1.0

tests:
  - python:
      imports:
        - footbridge
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Towards more pythonic use of GeoDatabases
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/footbridge/

extra:
  recipe-maintainers:
    - p-vdp
